name: Build and Release

# Deliberately NOT triggered by pull_request. This workflow holds the
# Developer ID signing key, and a pull_request trigger would hand that key to
# whatever code the pull request contains. Both triggers below require write
# access to the repository, which stays true when the repo goes public.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The Intel runtime must be built on an Intel runner: pygame and hidapi
  # publish no universal2 wheels, so PyInstaller emits one slice per
  # architecture.
  runtime-x86_64:
    uses: ./.github/workflows/runtime-x86_64.yml

  macos:
    name: Build, sign and release
    runs-on: macos-latest
    needs: runtime-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse a tag that disagrees with the tree
        # The tag names the asset and the release; the tree decides which
        # version gets compiled in. Nothing tied the two together, so tagging
        # v0.1.9 on a tree still saying 0.1.8 produced a file named v0.1.9
        # containing 0.1.8 -- and because Sparkle compares CFBundleVersion,
        # that release would be built, signed, notarized, published,
        # announced, and offered to nobody, with every step green.
        #
        # First step after checkout on purpose: the mistake costs nothing here
        # and fifteen minutes of building and notarizing anywhere later.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#v}"
          built="$(sed -n 's/.*JOYHARNESS_VERSION:-\([0-9.]*\)}.*/\1/p' \
            scripts/build-swiftui-macos-app.sh)"
          if [ "$tagged" != "$built" ]; then
            echo "Tag $GITHUB_REF_NAME does not match what this tree builds ($built)." >&2
            echo "Bump CHANGELOG.md, src/constants.py and" >&2
            echo "scripts/build-swiftui-macos-app.sh together, or tag v$built." >&2
            exit 1
          fi
          echo "Tag and tree agree on $built."

      - name: Set up Python
        # Pinned: the runner's default Python has no prebuilt pygame wheel and
        # tries to compile SDL from source.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Fetch the x86_64 runtime
        uses: actions/download-artifact@v4
        with:
          name: JoyHarnessRuntime-x86_64
          path: build/runtime-x86_64

      - name: Unpack it
        # A tarball, so symlinks and executable bits survive the round trip --
        # see the note in runtime-x86_64.yml.
        run: tar -xzf build/runtime-x86_64/JoyHarnessRuntime-x86_64.tar.gz -C build/runtime-x86_64

      - name: Import the signing certificate
        # Into a keychain created for this run and deleted at the end, so the
        # key never touches the runner's login keychain. The runner itself is
        # ephemeral, but a temporary keychain also keeps this from depending
        # on that being true.
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ]; then
            echo "MACOS_CERT_P12 is not set; this workflow cannot produce an" >&2
            echo "installable build. See docs/RUNBOOK.md." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/joyharness-signing.keychain-db"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt that no one can click.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # The identity name is read back from the keychain rather than
          # hardcoded, so renewing the certificate does not silently break the
          # build with a name mismatch.
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep 'Developer ID Application' | head -1 \
            | sed -E 's/.*"(.*)".*/\1/')"
          if [ -z "$identity" ]; then
            echo "No Developer ID Application identity in the imported certificate." >&2
            exit 1
          fi
          echo "Signing identity: $identity"
          echo "JOYHARNESS_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build, sign and notarize the DMG
        # Notarization credentials come from the environment here; locally
        # they come from a keychain profile. Without them the build still
        # produces a DMG and says loudly that it is not notarized -- so a
        # missing secret degrades to a warning rather than an outage, and the
        # assertion below is what actually catches it.
        env:
          JOYHARNESS_RUNTIME_BUNDLE_X86_64: ${{ github.workspace }}/build/runtime-x86_64/JoyHarnessRuntime
          JOYHARNESS_NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          JOYHARNESS_NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          JOYHARNESS_NOTARY_TEAM_ID: "7WCWLLYJFQ"
        run: bash scripts/build-dmg-installer.sh

      - name: Confirm the DMG is universal and properly signed
        # The build script already verifies the app. This re-checks the DMG
        # that is actually about to be published, from the outside, because
        # that is the file people download.
        run: |
          set -euo pipefail
          mountpoint="$(mktemp -d)"
          hdiutil attach dist/JoyHarness.dmg -nobrowse -quiet -mountpoint "$mountpoint"
          app="$mountpoint/JoyHarness.app"
          archs="$(lipo -archs "$app/Contents/MacOS/JoyHarness")"
          echo "Architectures: $archs"
          for required in arm64 x86_64; do
            echo "$archs" | grep -qw "$required" || {
              echo "Published DMG is missing the $required slice." >&2
              hdiutil detach "$mountpoint" -quiet
              exit 1
            }
          done
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d -r- "$app" | grep designated
          # A release asset must be notarized. Publishing one that is not
          # sends every downloader to System Settings to allow it by hand,
          # which reads as the app being broken -- better to fail the build.
          xcrun stapler validate "$app"
          verdict="$(spctl -a -t exec -vv "$app" 2>&1 || true)"
          echo "$verdict"
          printf '%s' "$verdict" | grep -q 'source=Notarized Developer ID' || {
            echo "The app in this DMG is not notarized." >&2
            hdiutil detach "$mountpoint" -quiet
            exit 1
          }
          hdiutil detach "$mountpoint" -quiet

      - name: Name the asset after the tag
        run: |
          tag="${{ github.ref_name }}"
          [ -n "$tag" ] || tag="manual-${{ github.run_number }}"
          asset="dist/JoyHarness-macos-$tag.dmg"
          mv dist/JoyHarness.dmg "$asset"
          # Record the bare filename, not the build path. A checksum file
          # saying "dist/JoyHarness-macos-v0.1.6.dmg" makes `shasum -c` fail
          # for the person who downloaded both files into one folder -- which
          # reads as a corrupted or tampered download rather than as a
          # cosmetic path problem.
          ( cd "$(dirname "$asset")" && shasum -a 256 "$(basename "$asset")" \
              | tee "$(basename "$asset").sha256" )
          echo "ASSET_PATH=$asset" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoyHarness-macos
          path: |
            ${{ env.ASSET_PATH }}
            ${{ env.ASSET_PATH }}.sha256

      - name: Attach to the release
        # Only for a tag. A workflow_dispatch run has no release to attach to,
        # and the artifact above is the way to inspect one.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the release if the tag does not have one yet. Uploading
          # alone assumed someone had already made it by hand, so the first
          # fully automatic release -- a tag pushed with nothing else done --
          # would fail at the last step with everything already built,
          # signed and notarized.
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes "See CHANGELOG.md."
          fi
          gh release upload "${{ github.ref_name }}" \
            "$ASSET_PATH" "$ASSET_PATH.sha256" --clobber

      - name: Generate the update feed
        # Only for a tag: appcast.xml announces releases, and a manual run has
        # not produced one. Without the key the step says so and stops rather
        # than publishing a feed with no signature -- Sparkle refuses unsigned
        # updates, so that would leave every client unable to update while
        # looking like it worked.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]; then
            echo "SPARKLE_ED_PRIVATE_KEY is not set; the update feed was not" >&2
            echo "regenerated, so existing installs will not see this release." >&2
            exit 1
          fi
          keyfile="$RUNNER_TEMP/sparkle_ed_key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | tr -d '\r\n' > "$keyfile"
          staging="$RUNNER_TEMP/appcast-input"
          mkdir -p "$staging"
          cp "$ASSET_PATH" "$staging/"
          # This prefix and SUFeedURL have to name the same host: the feed and
          # the packages it announces are served together, and
          # verify-native-ui-contract.py fails the build if they drift apart.
          ./build/sparkle/bin/generate_appcast \
            --ed-key-file "$keyfile" \
            --download-url-prefix "https://joyharness-1305183734.cos.ap-shanghai.myqcloud.com/" \
            -o appcast.xml "$staging"
          rm -f "$keyfile"

      - name: Publish to the download bucket
        # The step that actually delivers the release. GitHub above keeps the
        # archival copy and the fallback, but the updater and the website both
        # read the bucket, because mainland China cannot reliably reach
        # GitHub -- and the updater only ever talked to GitHub, so anyone who
        # could not reach it stayed on the version they first installed.
        #
        # It runs before the feed is recorded below, so a failure here leaves
        # nothing anywhere announcing a release that cannot be downloaded.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          # --alias publishes the same build a second time as JoyHarness.dmg.
          # The website links to that fixed address, so a release no longer
          # needs a matching edit and deploy in the website repository just to
          # move a version number -- and that edit being manual was the last
          # step of a release that a human still had to remember.
          python3 scripts/publish-to-cos.py \
            "$ASSET_PATH" "$ASSET_PATH.sha256" appcast.xml \
            --alias JoyHarness.dmg

      - name: Record the feed in the repository
        # Book-keeping, not delivery: the copy clients read is the one in the
        # bucket, published above. Kept because what was announced, and when,
        # is worth having in the history.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "Feed unchanged."
          else
            git commit -m "Announce ${{ github.ref_name }} in the update feed"
            # main can move while this runs -- the build, notarization and
            # upload take about fifteen minutes, which is long enough for
            # someone to push. Rebasing onto whatever main is now keeps a
            # release from failing at the last step over an unrelated commit,
            # with everything already published -- which is exactly how v0.1.7
            # failed.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Remove the signing keychain
        # always(), so the key does not survive a failed build.
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/cert.p12"
